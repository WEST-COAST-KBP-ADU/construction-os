name: graph-observation

# The mechanical observation layer of the Product 2 memory (W1 lane).
# Reads live GitHub state through the API only -- no checkout, no repository
# code executed -- and renders the raw slice a fresh session otherwise
# enumerates by hand into this run's job summary: exact mainSha, every open
# Issue with its state labels, every open PR with its head SHA.
#
# This job is read-only by declaration and by construction: the token carries
# no write scope, and the workflow performs no repository, Issue, or PR
# mutation. It does not write the SESSION-BOOTSTRAP Issue (#205) or any other
# Issue body; the observation lives only in the run's job summary, and a
# session reads it from there.
#
# This is NOT COLD_START_RESULT/v1 and holds no authority: it derives
# nothing, decides nothing, seats no lane, and launches nothing. Per
# governance/memory/SESSION-START.md, full hydration remains mandatory before
# any dispatch, review, gate, or mutation decision. A rendered observation is
# a durable read -- never approval, a gate, a heartbeat, or liveness.

on:
  schedule:
    - cron: "41 */3 * * *"
  push:
    branches: [main]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: graph-observation
  cancel-in-progress: true

jobs:
  graph-observation:
    name: graph-observation
    runs-on: ubuntu-latest
    steps:
      - name: Observe and render to the job summary
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Read-only helper: GET requests only, no mutating verb anywhere.
          api() {
            curl -sf -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                 -H "Accept: application/vnd.github+json" \
                 "https://api.github.com/repos/${GITHUB_REPOSITORY}$1"
          }

          main_sha="$(api /branches/main | jq -r '.commit.sha')"
          observed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          {
            echo "# SESSION-BOOTSTRAP — Product 2 (механический снимок)"
            echo
            echo "Rendered by [graph-observation run ${GITHUB_RUN_ID}](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) at ${observed_at}."
            echo "Read-only: nothing in the repository, and no Issue, was written."
            echo
            echo "**mainSha: \`${main_sha}\`**"
            echo
            echo "This is the raw observation layer, NOT \`COLD_START_RESULT/v1\`:"
            echo "no lane board, no eligibility, no authority. Per"
            echo "\`governance/memory/SESSION-START.md\`, full hydration remains"
            echo "mandatory before any dispatch, review, gate, or mutation"
            echo "decision. A label is a declaration; heartbeat is always unknown."
            echo
            echo "## Open Issues (number · state labels · title · updated)"
            echo
            api "/issues?state=open&per_page=100" | jq -r '
              [.[] | select(.pull_request | not)] | sort_by(.number) | .[] |
              "- #\(.number) · [\([.labels[].name | select(startswith("state:"))] | join(",") | if . == "" then "no state label" else . end)] · \(.title) · \(.updated_at)"'
            echo
            echo "## Open Pull Requests (number · draft · head · title)"
            echo
            api "/pulls?state=open&per_page=100" | jq -r '
              sort_by(.number) | .[] |
              "- PR #\(.number) · draft=\(.draft) · head \(.head.sha) (\(.head.ref)) · \(.title)"'
          } >> "${GITHUB_STEP_SUMMARY}"

          echo "observation rendered to the job summary at ${main_sha}"
