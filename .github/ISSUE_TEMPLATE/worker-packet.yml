name: Worker packet
description: Dispatch exactly one bounded packet under OPERATING-MODEL-v5. Opening this Issue starts no worker.
title: "[PACKET-ID] "
labels:
  - "state:ready"
body:
  - type: markdown
    attributes:
      value: |
        One Issue = one bounded outcome = one branch = one Draft PR = one declared file allowlist.

        A packet is closed-world authorization. The executor must not reinterpret ambiguous intent, invent a
        missing product decision, source, asset, geometry, interaction, visual reference, quality target,
        dependency, or acceptance rule; substitute a lower-quality surrogate; or widen the allowlist. Any
        missing or conflicting material precondition requires a fail-closed `BLOCKED` result before
        implementation proceeds.

        Opening, editing, labelling, or commenting on this Issue **does not launch an AI worker**. The Owner
        starts every worker manually in a fresh visible session. No Action, form, bot, mention, or integration
        in this repository launches a model.

        Every field below is required. A packet missing any field is not dispatchable.

  - type: input
    id: packet_id
    attributes:
      label: Packet ID
      description: Stable uppercase identifier, also used in the Issue title and the pull request body.
      placeholder: GITHUB-NATIVE-CONTROL-PLANE-001
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Single outcome
      description: Exactly one bounded, verifiable result stated as one sentence. Not a list of objectives.
    validations:
      required: true

  - type: input
    id: repository
    attributes:
      label: Repository
      placeholder: WEST-COAST-KBP-ADU/construction-os
    validations:
      required: true

  - type: input
    id: base_sha
    attributes:
      label: Exact base SHA
      description: Full 40-character commit SHA that currently exists on the remote. A branch name alone is rejected.
      placeholder: c201836eee31ff55472cb4731e11745e3094849d
    validations:
      required: true

  - type: dropdown
    id: worker
    attributes:
      label: Worker
      description: The named executor engagement. Sets the worker label. Selecting a worker launches nothing.
      options:
        - Opus
        - Codex
        - None
    validations:
      required: true

  - type: input
    id: model_id
    attributes:
      label: Exact model ID
      description: The exact model identifier the executor must run, or "none" for a packet with no executor.
      placeholder: claude-opus-5
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Mode
      description: Mutation packets author repository bytes and require one branch and one Draft PR. Read-only packets author none and hold no lease.
      options:
        - Mutation
        - Read-only
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - Implementation
        - Decision
        - Review
        - Remediation
        - Infrastructure
        - Research
    validations:
      required: true

  - type: dropdown
    id: gate
    attributes:
      label: Gate
      description: Program stage gate per governance/office/PROGRAM-PLAN-v1.md.
      options:
        - Control plane
        - G0
        - G1
        - G2A
        - G2B
        - G2C
        - G3
        - G4
        - G5
        - G6
        - Later
    validations:
      required: true

  - type: dropdown
    id: primary_domain
    attributes:
      label: Primary domain
      description: The single exclusive lease domain held for the life of this packet.
      options:
        - governance
        - github-control-plane
        - product-definition
        - visual-target
        - asset-readiness
        - platform-quality
        - engineering-foundation
        - a600-pipeline
        - product-vertical
        - release
        - reception
        - catalog
    validations:
      required: true

  - type: input
    id: clone
    attributes:
      label: Clone path
      description: Exact isolated checkout path for this engagement.
    validations:
      required: true

  - type: input
    id: session
    attributes:
      label: Session label
      description: Exact session label. Two engagements never share one label.
    validations:
      required: true

  - type: input
    id: branch
    attributes:
      label: Branch or read-only target
      description: Exactly one branch name for a mutation packet, or the exact read-only target (PR number, head SHA, or evidence surface) for a read-only packet.
    validations:
      required: true

  - type: textarea
    id: read_order
    attributes:
      label: Authoritative read order
      description: Complete enumerated list of every input the executor must read, in order. Open delegation such as "relevant docs" is prohibited.
      placeholder: |
        1. governance/BOUNDARIES.md
        2. governance/office/OPERATING-MODEL-v5.md
        3. governance/office/PROGRAM-PLAN-v1.md
    validations:
      required: true

  - type: textarea
    id: allowlist
    attributes:
      label: Exact file allowlist
      description: One line per path, each marked create, modify, or delete. Wildcards, directory-only entries, and open-ended entries are rejected. State "none" only for a read-only packet.
      placeholder: |
        create tools/control-plane/packet-gate.mjs
        modify governance/office/STATE.md
        delete .github/ISSUE_TEMPLATE/legacy-packet.yml
    validations:
      required: true

  - type: textarea
    id: domain_lease
    attributes:
      label: Domain lease
      description: Exclusive file or domain ownership claimed from STARTED to CLEANUP, and the concurrent lanes it must not overlap.
    validations:
      required: true

  - type: textarea
    id: prohibitions
    attributes:
      label: Prohibitions
      description: Explicit out-of-scope surfaces and actions for this packet.
    validations:
      required: true

  - type: textarea
    id: quality_target
    attributes:
      label: Quality target
      description: Exact and measurable. Adjectival targets such as "premium" or "polished" are rejected.
    validations:
      required: true

  - type: textarea
    id: gates
    attributes:
      label: Deterministic gates
      description: Exact commands and the exact expected outcome of each.
      placeholder: |
        npm test        -> exit 0
        npm run lint    -> exit 0
        npm run build   -> exit 0
    validations:
      required: true

  - type: input
    id: reviewer
    attributes:
      label: Independent reviewer
      description: Named non-author engagement identified in advance. The author of the head can never review it.
    validations:
      required: true

  - type: textarea
    id: integration_order
    attributes:
      label: Integration order and dependencies
      description: Position relative to predecessors and dependents, naming each predecessor Issue or PR. A packet may not depend on an unmerged predecessor.
    validations:
      required: true

  - type: textarea
    id: stop_conditions
    attributes:
      label: Stop conditions
      description: Named fail-closed BLOCKED codes for this packet. The executor may not widen scope to clear a blocker.
    validations:
      required: true

  - type: textarea
    id: result_contract
    attributes:
      label: RESULT and cleanup contract
      description: Required RESULT comment shape, evidence to publish, terminal disposition wording, and lease release.
    validations:
      required: true

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: This packet is one Issue, one session, one branch, and one Draft PR.
          required: true
        - label: The engagement that authors the head SHA will not review, accept, certify, or merge it.
          required: true
        - label: A new commit invalidates any earlier review verdict.
          required: true
        - label: Tony alone adopts the decision, approves, merges, and authorizes production promotion.
          required: true
        - label: The worker is launched manually by Tony in a fresh visible session. No Action, comment, mention, bot, or integration launches it.
          required: true
        - label: Every material product decision this packet relies on is already Owner-adopted, or this packet is the decision-preparation packet and implements nothing.
          required: true
